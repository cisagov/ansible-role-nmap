---
- name: Determine if installing from Debian Backports
  ansible.builtin.set_fact:
    install_from_backports: >-
      {{
        ansible_distribution == "Debian"
        and ansible_distribution_release in ["bullseye", "bookworm"]
      }}

- name: Install nmap
  ansible.builtin.package:
    name: nmap
  # yamllint/ansible-lint complains about this being too long, but
  # there is no clean way to break it up.
  #
  # yamllint disable-line rule:line-length
  when: not install_from_backports

- name: Install nmap from Debian Backports
  when: install_from_backports
  block:
    - name: Add the Debian Backports repository
      ansible.builtin.include_role:
        name: backports

    - name: Install nmap
      ansible.builtin.apt:
        default_release: "{{ ansible_distribution_release }}-backports"
        name: nmap
